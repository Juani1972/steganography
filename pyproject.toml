[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stegstr"
version = "2.2.0"
description = "Esteganografía LSB avanzada con validación E2E en redes sociales"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Juani1972", email = "juani@example.com"},
]
keywords = ["steganography", "lsb", "image", "security", "social-media"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
]

dependencies = [
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "cryptography>=41.0.0",
    "reedsolo>=1.7.0",
    "opencv-python>=4.8.0",
    "scikit-image>=0.21.0",
]

[project.optional-dependencies]
gui = [
    "flask>=2.3.0",
    "flask-cors>=4.0.0",
]
social = [
    "requests>=2.31.0",
    "tweepy>=4.14.0",
    "praw>=7.7.0",
    "pyrogram>=2.0.0",
    "aiohttp>=3.9.0",
    "websockets>=12.0",
    "secp256k1>=0.14.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]
full = [
    "stegstr[gui,social,dev]",
]

[project.scripts]
stegstr = "stegstr.cli:main"
stegstr-gui = "stegstr.gui.widget_server:main"
stegstr-nostr = "stegstr.nostr.client:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["stegstr*"]

[tool.ruff]
line-length = 120
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
